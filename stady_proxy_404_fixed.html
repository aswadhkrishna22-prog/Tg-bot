<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STADY-PROXY 404</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
    body {
        background-color: #050b14;
        color: #0ff;
        font-family: 'Orbitron', sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
    }
    h1.title {
        font-size: 2.2rem;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #0ff;
        margin-bottom: 20px;
    }
    .image-container {
        width: 90%;
        max-width: 450px;
        border: 2px solid #0ff;
        border-radius: 10px;
        padding: 5px;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2);
        margin-bottom: 30px;
    }
    .image-container img {
        width: 100%;
        border-radius: 5px;
        display: block;
    }
    .return-btn {
        background: transparent;
        border: 2px solid #0ff;
        color: #0ff;
        padding: 15px 50px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2), 0 0 10px rgba(0, 255, 255, 0.4);
        margin-bottom: 30px;
        position: relative;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .return-btn::before, .return-btn::after {
        content: 'error';
        position: absolute;
        color: #ff2a2a;
        font-size: 0.65rem;
        text-shadow: 0 0 5px #ff2a2a;
    }
    .return-btn::before { top: -8px; left: 15px; background: #050b14; padding: 0 5px; }
    .return-btn::after { bottom: -8px; right: 15px; background: #050b14; padding: 0 5px; }
    
    .error-code {
        font-size: 7rem;
        font-weight: 900;
        margin: 0;
        line-height: 1;
        text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    }
    .error-text {
        font-size: 4.5rem;
        font-weight: 700;
        margin: 0;
        text-shadow: 0 0 15px #0ff;
    }
    .subtitle {
        font-size: 1.5rem;
        margin: 10px 0;
        letter-spacing: 1px;
    }
    .disconnected {
        color: #f0f;
        font-size: 1.2rem;
        font-weight: bold;
        text-shadow: 0 0 10px #f0f;
        margin-top: 10px;
    }
</style>
</head>
<body>
    <h1 class="title">STADY-PROXY</h1>
    
    <div class="image-container">
        <img src="404_image.png" alt="Cityscape">
    </div>
    
    <button class="return-btn" onclick="window.location.href='/'">RETURN HOME</button>
    
    <p class="error-code">404</p>
    <p class="error-text">ERROR</p>
    <p class="subtitle">PROXY PATH NOT FOUND</p>
    <p class="disconnected">DISCONNECTED FROM STREAM</p>
</body>
</html>
