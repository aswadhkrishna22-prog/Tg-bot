<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#020812">
<title>STADY-PROXY — 404 ERROR</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020812;
}

body {
    overflow-x: hidden;
}

.error-page {
    position: relative;
    width: 100%;
    max-width: 691px;
    margin: 0 auto;
    line-height: 0;
}

.error-page img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
}

.return-home {
    position: absolute;
    left: 12%;
    top: 42.2%;
    width: 76%;
    height: 14%;
    display: block;
    cursor: pointer;
    background: transparent;
    border: 0;
    padding: 0;
}

.unavailable-message{
    position:absolute;
    left:50%;
    top:39%;
    transform:translate(-50%,-50%);
    width:80%;
    text-align:center;
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:clamp(16px,3.8vw,25px);
    font-weight:700;
    line-height:1.3;
    text-shadow:0 0 8px #00eaff,0 0 16px rgba(255,24,213,.8);
    pointer-events:none;
    z-index:2;
}

@media (min-width: 692px) {
    .error-page {
        box-shadow: 0 0 45px rgba(0, 238, 255, .16);
    }
}
</style>

<style>
.spark-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.spark{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#b9ffff;
    box-shadow:
        0 0 4px #00eaff,
        0 0 9px #00eaff,
        0 0 16px #ff22dc;
    opacity:0;
    animation:sparkFly 2.8s linear infinite;
}

.spark::after{
    content:"";
    position:absolute;
    left:-8px;
    top:1px;
    width:12px;
    height:1px;
    background:linear-gradient(90deg,transparent,#00eaff);
    transform:rotate(-20deg);
    transform-origin:right center;
}

@keyframes sparkFly{
    0%{
        opacity:0;
        transform:translate(0,18px) scale(.35);
    }
    8%{opacity:1;}
    45%{
        opacity:1;
        transform:translate(38px,-28px) scale(1);
    }
    78%{opacity:.75;}
    100%{
        opacity:0;
        transform:translate(82px,-70px) scale(.1);
    }
}

.glitch-line{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent 0%,
        rgba(0,238,255,.0) 15%,
        rgba(0,238,255,.9) 35%,
        rgba(255,24,213,.8) 55%,
        transparent 85%
    );
    filter:blur(.4px);
    opacity:0;
    animation:scanGlitch 4.6s ease-in-out infinite;
}

@keyframes scanGlitch{
    0%,72%,100%{opacity:0;transform:translateX(-20%);}
    74%{opacity:.75;}
    77%{opacity:.25;transform:translateX(8%);}
    80%{opacity:.65;transform:translateX(-4%);}
    84%{opacity:0;transform:translateX(20%);}
}
</style>
</head>

<body>
<main class="error-page">
    <div class="unavailable-message" role="alert">Sorry! This file is currently unavailable.</div>
    
<div class="spark-layer" aria-hidden="true">
    <i class="spark" style="left:18%;top:27%;animation-delay:.15s"></i>
    <i class="spark" style="left:28%;top:34%;animation-delay:1.05s"></i>
    <i class="spark" style="left:47%;top:29%;animation-delay:.55s"></i>
    <i class="spark" style="left:62%;top:39%;animation-delay:1.75s"></i>
    <i class="spark" style="left:73%;top:25%;animation-delay:2.15s"></i>
    <i class="spark" style="left:84%;top:43%;animation-delay:.85s"></i>
    <i class="spark" style="left:14%;top:52%;animation-delay:2.45s"></i>
    <i class="spark" style="left:57%;top:51%;animation-delay:1.35s"></i>
    <i class="spark" style="left:78%;top:61%;animation-delay:.35s"></i>
    <div class="glitch-line" style="top:30%"></div>
    <div class="glitch-line" style="top:47%;animation-delay:2.2s"></div>
    <div class="glitch-line" style="top:68%;animation-delay:3.1s"></div>
</div>

    <img
        src="/stady-proxy-404.png"
        alt="STADY-PROXY 404 ERROR"
        draggable="false"
    >

    <!-- Invisible clickable area over the exact RETURN HOME button -->
    <a
        class="return-home"
        href="https://t.me/AdolfFTLbot?start=unavailable"
        aria-label="Return Home"
    ></a>
</main>
</body>
</html>
